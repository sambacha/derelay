version: "3"
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [ "/derelay" ]
    command:
      - "--config"
      - "/config/config.yaml"
    volumes:
      # Use the E2E specific config for testing
      - ./config/e2e-config.yaml:/config/config.yaml
    networks:
      - derelay
    depends_on:
      - redis
    ports:
      - "8080:8080"
    restart: always
  redis:
    image: redis:latest
    networks:
      - derelay

networks:
  derelay:
    driver: bridge
